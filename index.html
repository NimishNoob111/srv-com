<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostSMC | Premium Minecraft Network</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('minecraft.ttf');
        }

        :root {
            --bg-dark: #050505;
            --card-bg: rgba(10, 10, 10, 0.9);
            --blood-red: #8b0000;
            --neon-red: #ff0000;
            --neon-glow: 0 0 20px rgba(255, 0, 0, 0.5);
            --discord-blue: #5865F2;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)),
                url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
        }

        /* --- Top Navigation Bar --- */
        .top-bar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 75px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 3px solid var(--blood-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-logo {
            font-family: 'Minecraft', sans-serif;
            font-size: 1.8rem;
            color: white;
            text-shadow: var(--neon-glow);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-item {
            text-decoration: none;
            color: #888;
            font-family: 'Minecraft', sans-serif;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            padding: 10px 0;
            position: relative;
        }

        .nav-item img, .nav-item svg {
            width: 26px;
            height: 26px;
            filter: grayscale(1);
            transition: var(--transition);
        }

        .nav-item:hover {
            color: white;
        }

        .nav-item:hover img, .nav-item:hover svg {
            filter: grayscale(0) drop-shadow(0 0 8px var(--neon-red));
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--neon-red);
            transition: var(--transition);
        }

        .nav-item:hover::after {
            width: 100%;
        }

        /* --- Main Content --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-top: 75px;
            z-index: 2;
        }

        .hero-title {
            font-family: 'Minecraft', sans-serif;
            font-size: 7.5rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-bottom: 10px;
            animation: static-pulse 3s infinite alternate;
        }

        @keyframes static-pulse {
            from { text-shadow: 0 0 15px var(--blood-red); }
            to { text-shadow: 0 0 35px var(--neon-red), 0 0 10px var(--blood-red); }
        }

        .subtitle-box {
            background: var(--card-bg);
            padding: 30px 70px;
            border: 1px solid rgba(139, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            margin-bottom: 40px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modes-list {
            color: #fff;
            font-family: 'Minecraft', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 3px;
        }

        .copy-btn {
            background: var(--blood-red);
            color: white;
            border: 2px solid var(--neon-red);
            padding: 22px 70px;
            font-family: 'Minecraft', sans-serif;
            font-size: 1.6rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--neon-glow);
            letter-spacing: 3px;
        }

        .copy-btn:hover {
            background: var(--neon-red);
            transform: translateY(-5px);
            box-shadow: 0 0 50px var(--neon-red);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        /* --- Bottom Status Bar --- */
        .bottom-status {
            width: 100%;
            background: #000;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--blood-red);
        }

        .status-text {
            font-family: 'Minecraft', sans-serif;
            color: #eee;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .online-indicator {
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 15px;
            box-shadow: 0 0 15px #00ff00;
        }

        #copy-alert {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Minecraft', sans-serif;
            color: var(--neon-red);
            font-size: 0.9rem;
            opacity: 0;
            transition: 0.3s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title { font-size: 3.8rem; letter-spacing: 4px; }
            .top-bar { padding: 0 20px; }
            .nav-links { gap: 20px; }
            .nav-item span { display: none; }
            .bottom-status { flex-direction: column; gap: 15px; text-align: center; }
            .subtitle-box { padding: 20px 30px; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="#" class="nav-logo">GHOSTSMC</a>
        <nav class="nav-links">
            <a href="https://console.ghostsmc.in/" class="nav-item">
                <img src="ghostnodes.png" alt="" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1243/1243560.png'">
                <span>Hosting</span>
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24" fill="#ffd700"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                <span>Shop</span>
            </a>
            <a href="https://discord.gg/zDzGfd8ZnA" class="nav-item discord">
                <svg viewBox="0 0 127.14 96.36" fill="#5865F2">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.06,72.06,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.71,32.65-1.82,56.6.48,80.05a105.73,105.73,0,0,0,32.06,16.15,77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.72-27.09-4.5-50.88-19.43-71.91ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.07,65.69,84.69,65.69Z"/>
                </svg>
                <span>Discord</span>
            </a>
        </nav>
    </header>

    <main class="main-container">
        <h1 class="hero-title">GhostSMC</h1>
        
        <div class="subtitle-box">
            <p style="font-family: 'Minecraft'; color: #666; margin-bottom: 10px; letter-spacing: 2px;">AVAILABLE MODES</p>
            <p class="modes-list">DUELS • SURVIVAL</p>
            <p style="font-size: 0.85rem; color: var(--blood-red); margin-top: 15px; font-family: 'Minecraft';">MINIGAMES (COMING SOON)</p>
        </div>

        <div style="position: relative;">
            <button class="copy-btn" onclick="copyIP()">
                PLAY.GHOSTSMC.IN
            </button>
            <p id="copy-alert">IP COPIED TO CLIPBOARD!</p>
        </div>
    </main>

    <footer class="bottom-status">
        <div style="display: flex; gap: 50px;">
            <div class="status-text">SERVER IP: PLAY.GHOSTSMC.IN</div>
            <div class="status-text">
                <span class="online-indicator"></span>
                <span id="player-count">...</span> PLAYERS ONLINE
            </div>
        </div>
        <div class="status-text" id="server-motd" style="color: #666; font-size: 0.9rem; font-style: italic;">Connecting to GhostSMC...</div>
    </footer>

    <script>
        // Copy IP Function
        function copyIP() {
            navigator.clipboard.writeText("play.ghostsmc.in");
            const alert = document.getElementById('copy-alert');
            alert.style.opacity = '1';
            setTimeout(() => alert.style.opacity = '0', 2000);
        }

        // Live API Fetch
        async function fetchServerStatus() {
            try {
                const response = await fetch('https://api.mcsrvstat.us/2/play.ghostsmc.in');
                const data = await response.json();
                
                if(data.online) {
                    document.getElementById('player-count').innerText = data.players.online;
                    document.getElementById('server-motd').innerText = data.motd.clean[0] || "GhostSMC | Duels & Survival";
                } else {
                    document.getElementById('player-count').innerText = "0";
                    document.getElementById('server-motd').innerText = "SERVER CURRENTLY OFFLINE";
                }
            } catch (error) {
                console.error("API Error");
            }
        }

        // Initial fetch and refresh every 60 seconds
        fetchServerStatus();
        setInterval(fetchServerStatus, 60000);
    </script>
</body>
</html>
