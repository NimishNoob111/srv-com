<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostSMC | Premium Minecraft Network</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('minecraft.ttf');
        }

        :root {
            --bg-dark: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.8);
            --blood-red: #8b0000;
            --neon-red: #ff0000;
            --neon-glow: 0 0 15px rgba(255, 0, 0, 0.6);
            --discord-blue: #5865F2;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1627398242454-45a1465c2479?q=80&w=1974&auto=format&fit=crop'); /* Placeholder premium dark forest/pvp bg */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100%;
            width: 70px;
            background: rgba(5, 5, 5, 0.95);
            border-right: 2px solid var(--blood-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            transition: var(--transition);
            z-index: 100;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 200px;
        }

        .sidebar-item {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ccc;
            transition: var(--transition);
            cursor: pointer;
            white-space: nowrap;
        }

        .sidebar-item:hover {
            background: rgba(139, 0, 0, 0.2);
            color: white;
        }

        .sidebar-item img, .sidebar-item svg {
            width: 30px;
            height: 30px;
            min-width: 30px;
            margin-right: 20px;
            filter: drop-shadow(0 0 2px black);
        }

        .sidebar-item.discord:hover {
            box-shadow: inset 5px 0 0 var(--discord-blue);
            filter: drop-shadow(0 0 10px var(--discord-blue));
        }

        .sidebar-text {
            font-family: 'Minecraft', sans-serif;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sidebar:hover .sidebar-text {
            opacity: 1;
        }

        /* --- Main Content --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-left: 70px; /* Offset for sidebar */
        }

        .hero-title {
            font-family: 'Minecraft', sans-serif;
            font-size: 5rem;
            color: white;
            text-transform: uppercase;
            text-shadow: var(--neon-glow);
            animation: pulse-red 2s infinite alternate;
            margin-bottom: 10px;
        }

        @keyframes pulse-red {
            from { text-shadow: 0 0 10px var(--blood-red), 0 0 20px var(--blood-red); }
            to { text-shadow: 0 0 20px var(--neon-red), 0 0 40px var(--neon-red); }
        }

        .subtitle {
            background: var(--card-bg);
            padding: 20px 40px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .subtitle h2 {
            font-family: 'Minecraft', sans-serif;
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .modes {
            color: var(--neon-red);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .copy-ip-btn {
            background: var(--blood-red);
            color: white;
            border: none;
            padding: 15px 40px;
            font-family: 'Minecraft', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: var(--transition);
            box-shadow: var(--neon-glow);
            position: relative;
            overflow: hidden;
        }

        .copy-ip-btn:hover {
            background: var(--neon-red);
            transform: translateY(-3px);
            box-shadow: 0 0 25px var(--neon-red);
        }

        .copy-ip-btn:active {
            transform: translateY(0);
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            width: calc(100% - 70px);
            margin-left: 70px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--blood-red);
        }

        .status-group {
            display: flex;
            gap: 30px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
        }

        .status-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
        }

        .status-value {
            font-family: 'Minecraft', sans-serif;
            color: #eee;
        }

        .motd {
            color: #888;
            font-style: italic;
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 8px #00ff00;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .sidebar { width: 60px; }
            .sidebar:hover { width: 60px; }
            .sidebar-text { display: none; }
            .bottom-bar { 
                flex-direction: column; 
                gap: 10px; 
                text-align: center;
                width: calc(100% - 60px);
                margin-left: 60px;
            }
            .main-container { padding-left: 60px; }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="https://console.ghostsmc.in/" class="sidebar-item">
            <img src="ghostnodes.png" alt="Nodes" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1243/1243560.png'">
            <span class="sidebar-text">Hosting</span>
        </a>
        <a href="#" class="sidebar-item">
            <svg viewBox="0 0 24 24" fill="currentColor" style="color: #ffd700;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
            <span class="sidebar-text">Store</span>
        </a>
        <a href="https://discord.gg/zDzGfd8ZnA" class="sidebar-item discord">
            <svg viewBox="0 0 127.14 96.36" fill="#5865F2">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.06,72.06,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.71,32.65-1.82,56.6.48,80.05a105.73,105.73,0,0,0,32.06,16.15,77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.72-27.09-4.5-50.88-19.43-71.91ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.07,65.69,84.69,65.69Z"/>
            </svg>
            <span class="sidebar-text">Discord</span>
        </a>
    </nav>

    <main class="main-container">
        <h1 class="hero-title">GhostSMC</h1>
        
        <div class="subtitle">
            <h2>AVAILABLE MODES</h2>
            <p class="modes">DUELS • SURVIVAL</p>
            <p style="font-size: 0.8rem; color: #555; margin-top: 5px;">Minigames (Coming Soon)</p>
        </div>

        <button class="copy-ip-btn" onclick="copyIP()">
            PLAY.GHOSTSMC.IN
        </button>
        <p id="copy-msg" style="margin-top: 10px; font-size: 0.8rem; color: var(--neon-red); opacity: 0; transition: 0.3s;">IP Copied to Clipboard!</p>
    </main>

    <footer class="bottom-bar">
        <div class="status-group">
            <div class="status-item">
                <span class="status-label">Server Address</span>
                <span class="status-value">play.ghostsmc.in</span>
            </div>
            <div class="status-item">
                <span class="status-label">Status</span>
                <span class="status-value"><span class="online-dot"></span> <span id="player-count">0</span> Players Online</span>
            </div>
        </div>
        <div class="motd" id="server-motd">
            Connecting to network...
        </div>
    </footer>

    <script>
        // Copy IP Function
        function copyIP() {
            const ip = "play.ghostsmc.in";
            navigator.clipboard.writeText(ip).then(() => {
                const msg = document.getElementById('copy-msg');
                msg.style.opacity = '1';
                setTimeout(() => {
                    msg.style.opacity = '0';
                }, 2000);
            });
        }

        // Fetch Server Status
        async function updateStatus() {
            try {
                const response = await fetch('https://api.mcsrvstat.us/2/play.ghostsmc.in');
                const data = await response.json();
                
                if (data.online) {
                    document.getElementById('player-count').innerText = data.players.online;
                    // Taking the first line of MOTD clean (no codes)
                    if (data.motd && data.motd.clean) {
                        document.getElementById('server-motd').innerText = data.motd.clean[0];
                    }
                } else {
                    document.getElementById('player-count').innerText = "Offline";
                    document.getElementById('server-motd').innerText = "Server is currently under maintenance.";
                }
            } catch (error) {
                console.error("Failed to fetch server status");
            }
        }

        // Run status update on load and every 60 seconds
        updateStatus();
        setInterval(updateStatus, 60000);
    </script>
</body>
</html>
